<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Projetos</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/geral.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/projetos.css">
    <link rel="stylesheet" href="css/categoria.css">
</head>
<body>

    <!-- LOGIN -->
    <section id="telaLogin" class="login-container">
        <form id="formLogin" class="login-card">
            <h2 class="login-titulo">Sistema de Projetos</h2>
            <p class="login-subtitulo">Entre com suas credenciais</p>

            <div class="grupo-campo">
                <label for="loginEmail" class="rotulo-campo">Usuário</label>
                <input type="text" id="loginEmail" class="campo-input" required autocomplete="username">
            </div>

            <div class="grupo-campo">
                <label for="loginSenha" class="rotulo-campo">Senha</label>
                <input type="password" id="loginSenha" class="campo-input" required autocomplete="current-password">
            </div>

            <p id="erroLogin" class="login-erro oculto"></p>

            <button type="submit" id="btnLogin" class="btn-cadastro">Entrar</button>
        </form>

        <p>Não possui conta?</p>
        <button type="button" id="btnIrCadastro" class="login-cadastro">Cadastre-se</button>
    </section>

    <!-- CADASTRO -->
    <section id="telaCadastro" class="login-container oculto">
        <form id="formCadastro" class="login-card">
            <h2 class="login-titulo">Sistema de Projetos</h2>
            <p class="login-subtitulo">
                <b>A senha deve possuir:</b>
                <br>8 caracteres ou mais;
                <br>Uma letra maiúscula;
                <br>Uma letra minúscula;
                <br>Um número;
                <br>Um símbolo.
            </p>

            <div class="grupo-campo">
                <label for="cadastrarEmail" class="rotulo-campo">Usuário</label>
                <input type="text" id="cadastrarEmail" class="campo-input" required autocomplete="username">
            </div>

            <div class="grupo-campo">
                <label for="cadastrarSenha" class="rotulo-campo">Senha</label>
                <input type="password" id="cadastrarSenha" class="campo-input" required autocomplete="new-password">
            </div>

            <p id="erroCadastro" class="login-erro oculto"></p>

            <button type="submit" id="btnCadastro" class="btn-cadastro">Cadastrar</button>
        </form>

        <p>Já possui conta?</p>
        <button type="button" id="btnIrLogin" class="login-e-cadastro">Entrar</button>
    </section>

    <aside class="sidebar oculto">
        <div class="sidebar-header">
            <ion-icon name="folder-open"></ion-icon>
            <p class="logo-texto">
                Sistema<br>de Projetos
            </p>
        </div>

        <ul class="sidebar-menu">
            <li class="sidebar-item ativo">
                <a href="#dashboard" onclick="paginacao(1)">
                    <ion-icon name="home" class="icone"></ion-icon>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="#projetos" onclick="paginacao(2)">
                    <ion-icon name="newspaper"></ion-icon>
                    <span>Projetos</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="#categorias" onclick="paginacao(3)">
                    <ion-icon name="menu"></ion-icon>
                    <span>Categorias</span>
                </a>
            </li>
        </ul>
    </aside>

    <main class="conteudo-principal oculto">
        <header class="top-header">
            <div class="metrica-conteudo">
                <span class="metrica-data-titulo" id="dia"></span>
                <span class="metrica-data-subtitulo" id="horario"></span>
            </div>

            <div class="menu-usuario-header">
                <div class="avatar avatar-header">
                    <ion-icon name="person"></ion-icon>
                </div>
                <span id="nomeUsuario" style="font-weight: 600;"></span>
            </div>
        </header>

        <!-- inseridos dos outros arquivos .html pelo js -->
        <div id="painel-corpo">
            <section id="paginaDashboard"></section>
            <section id="paginaProjetos" class="oculto"></section>
            <section id="paginaCategorias" class="oculto"></section>
        </div>

        <section id="alterar" class="oculto">
            <div class="alterar-cabecalho">
                <h2>Alterar projeto</h2>
                <button type="button" id="ocultar">
                    <ion-icon name="close-outline"></ion-icon>
                </button>
            </div>

            <div>
                <form id="formAlterar">

                    <input type="text" id="inputId" class="oculto">

                    <label for="nomeNovo" class="rotulo-campo">Nome:</label>
                    <input type="text" id="nomeNovo" class="campo-input" required>

                    <label for="descricaoNova" class="rotulo-campo">Descrição:</label>
                    <textarea id="descricaoNova" class="campo-input" required></textarea>

                    <label for="categoriaNova" class="rotulo-campo">Categoria:</label>
                    <select id="categoriaNova" class="campo-select">
                        <option value="Software" selected>Software</option>
                        <option value="Web">Web</option>
                        <option value="Mobile">Mobile</option>
                    </select>

                    <label for="statusNovo" class="rotulo-campo">Status:</label>
                    <select id="statusNovo" class="campo-input">
                        <option value="Planejado">Planejado</option>
                        <option value="Em desenvolvimento">Em desenvolvimento</option>
                        <option value="Concluido">Concluído</option>
                    </select>

                    <button class="btn-cadastro" type="submit">Alterar projeto</button>
                </form>
            </div>
        </section>

    </main>

    <!-- módulos já são "defer" por padrão; o atributo era redundante -->
    <script type="module" src="js/script.js"></script>
    <script type="module" src="js/paginas.js"></script>
    <script type="module" src="js/api.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>

</body>
</html>
