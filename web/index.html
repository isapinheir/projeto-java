<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Projetos</title>
    <link rel="stylesheet" href="css/geral.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/projetos.css">
    <link rel="stylesheet" href="css/categoria.css">
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <ion-icon name="folder-open"></ion-icon>
            <p class="logo-texto">
                Sistema<br>de Projetos
            </p>
        </div>

        <ul class="sidebar-menu">
            <li class="sidebar-item ativo">
                <a href="#dashboard" onclick="paginacao(1)">
                    <ion-icon name="home" class="icone"></ion-icon>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="#projetos" onclick="paginacao(2)"">
                    <ion-icon name="newspaper"></ion-icon>
                    <span>Projetos</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="#categorias" onclick="paginacao(3)">
                    <ion-icon name="menu"></ion-icon>
                    <span>Categorias</span>
                </a>
            </li>
        </ul>

    </aside>

    <main class="conteudo-principal">
        <header class="top-header">          
            <div class="metrica-conteudo">
                <span class="metrica-data-titulo" id="dia"></span>
                <span class="metrica-data-subtitulo" id="horario"></span>
            </div>

            <div class="menu-usuario-header">
                <div class="avatar avatar-header">
                    <ion-icon name="person"></ion-icon>
                </div>
                <span style="font-weight: 600;">João Silva</span>
            </div>
        </header>

        <!-- inseridos dos outros arqiuivos .html pelo js -->
        <div id="painel-corpo">
            <section id="paginaDashboard"></section>
            <section id="paginaProjetos" class="oculto"></section>
            <section id="paginaCategorias" class="oculto"></section>
        </div>

        <section id="alterar" class="oculto">
            <div class="alterar-cabecalho">
                <h2>Alterar projeto</h2>
                <button id="ocultar">
                    <ion-icon name="close-outline"></ion-icon>
                </button>
            </div>
            
            <div>
                <form id="formAlterar">

                    <input type="text" id="inputId" class="oculto">

                    <label for="nomeNovo" class="rotulo-campo">Nome:</label>
                    <input type="text" id="nomeNovo" class="campo-input" required>

                    <label for="descricaoNova" class="rotulo-campo">Descrição:</label>
                    <textarea id="descricaoNova" class="campo-input" required></textarea>

                    <label for="categoriaNova" class="rotulo-campo">Categoria:</label>
                    <input type="text" id="categoriaNova" class="campo-input" required>

                    <label for="statusNovo" class="rotulo-campo">Status:</label>
                    <select id="statusNovo" class="campo-input">

                        <option value="Planejado">Planejado</option>
                        <option value="Em desenvolvimento">Em desenvolvimento</option>
                        <option value="Concluido">Concluído</option>

                    </select>

                    <button class="btn-cadastro" type="submit">Alterar projeto</button>
                </form>
            </div>
        </section>

    </main>

    <script type="module" src="js/script.js" defer></script>
    <script type="module" src="js/paginas.js" defer></script>
    <script type="module" src="js/api.js" defer></script>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>

</body>
</html>
